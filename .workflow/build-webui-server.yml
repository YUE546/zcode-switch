version: '1.0'
name: build-webui-server
displayName: 构建 Web UI 服务版（Windows，无 WebView2）
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - no-webview2
stages:
  - name: stage-build
    displayName: 构建
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      # 在 Linux 构建节点上用 mingw-w64 交叉编译 x86_64-pc-windows-gnu release。
      # 产物 = 自包含运行包（zcode-switch.exe 完整桌面功能 + --server Web UI 模式 + dist）。
      # Gitee Go 节点外网带宽极低（实测 ~41kB/s），所有下载走国内镜像。
      # 本项目无 BoringSSL/bindgen（RustCrypto 纯 Rust），不需要 nasm/libclang 之外的重依赖；
      # nasm 保留（ureq→ring 的 windows-gnu 汇编可能用到）。
      - step: build@rust
        name: cross_build_windows
        displayName: 交叉编译 Windows Web UI 版
        rustVersion: '1.93'
        commands:
          - set -e
          - '# ===== 1. apt 镜像测速择优（Packages.gz 探持续吞吐）====='
          - best_mirror=mirrors.aliyun.com; best_speed=0
          - for m in mirrors.aliyun.com mirrors.tuna.tsinghua.edu.cn mirrors.ustc.edu.cn mirrors.tencent.com; do speed=$(curl -m 15 -o /dev/null -s -w '%{speed_download}' "https://$m/ubuntu/dists/jammy/main/binary-amd64/Packages.gz" || echo 0); speed=${speed%%.*}; echo "mirror $m -> ${speed}B/s"; if [ "$speed" -gt "$best_speed" ]; then best_speed=$speed; best_mirror=$m; fi; done
          - echo "using mirror: $best_mirror ($best_speed B/s)"
          - '[ -f /etc/apt/sources.list ] && sed -i "s|mirrors\.aliyun\.com|$best_mirror|g" /etc/apt/sources.list || true'
          - '[ -f /etc/apt/sources.list.d/ubuntu.sources ] && sed -i "s|mirrors\.aliyun\.com|$best_mirror|g" /etc/apt/sources.list.d/ubuntu.sources || true'
          - du -sh /var/cache/apt/archives /var/lib/apt/lists "$HOME/.cargo" 2>/dev/null || true
          - ''
          - '# ===== 2. 系统依赖（最小集）：MinGW 交叉工具链 + nasm（ring win32 汇编）+ zip ====='
          - '# Ubuntu 22.04+ apt 默认装完即删 .deb，导致 /var/cache/apt/archives 缓存永远为空、每轮重下 119MB；改为保留以吃平台缓存'
          - echo 'APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/keep-downloaded-packages
          - '# lists 缓存可能"文件在但内容残缺"（ls 有文件不代表包可解析），用 dry-run 实测：解析失败就强制 update'
          - apt-get -o Acquire::Retries=10 install --dry-run --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm zip >/dev/null 2>&1 || { echo "apt lists stale/incomplete -> forcing update"; apt-get -o Acquire::Retries=10 update; }
          - apt-get -o Acquire::Retries=10 install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm zip
          - '# 装完立即硬校验（此前 apt 失败会被静默跳过，直到编译 dlltool 才炸）'
          - x86_64-w64-mingw32-gcc --version | head -n 1
          - x86_64-w64-mingw32-dlltool --version | head -n 1 || { echo "FATAL: dlltool missing right after apt install"; dpkg -l | grep -i mingw || true; ls /usr/bin | grep mingw32 | head -n 60 || true; exit 1; }
          - '# windows-rs 对 windows-gnu 目标会以首字母大写库名发链接参数，GNU ld 大小写敏感，补别名'
          - for f in kernel32 user32 advapi32 ole32 shell32 bcrypt ntdll dbghelp version userenv ws2_32 oleaut32 gdi32; do ln -sf "/usr/x86_64-w64-mingw32/lib/lib$f.a" "/usr/x86_64-w64-mingw32/lib/lib$(echo "$f" | sed -r 's/^(.)/\U\1/').a"; done
          - '# ===== 2.5 dlltool/windres 自愈：alternatives 偶发缺 symlink，从任意同名二进制补链 ====='
          - for t in dlltool windres; do if [ ! -x "/usr/bin/x86_64-w64-mingw32-$t" ]; then found=$(find /usr -name "x86_64-w64-mingw32-$t*" -type f 2>/dev/null | head -n 1); if [ -n "$found" ]; then ln -sf "$found" "/usr/bin/x86_64-w64-mingw32-$t"; echo "linked $t -> $found"; else update-alternatives --auto "x86_64-w64-mingw32-$t" 2>/dev/null || apt-get -o Acquire::Retries=10 install -y --reinstall binutils-mingw-w64-x86-64; fi; fi; done
          - x86_64-w64-mingw32-dlltool --version | head -n 1
          - ''
          - '# ===== 3. Rust 工具链：插件预装 rust 位于只读目录，重定向自装 ====='
          - set -e
          - export RUSTUP_HOME=/root/.rustup
          - export CARGO_HOME=/root/.cargo
          - export RUSTUP_DIST_SERVER=https://rsproxy.cn
          - export RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup
          - rm -rf "$CARGO_HOME/bin"
          - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          - . "$CARGO_HOME/env"
          - rustup target add x86_64-pc-windows-gnu
          - rustc --version && cargo --version
          - ''
          - '# ===== 4. crates.io 国内镜像（rsproxy）====='
          - mkdir -p "$HOME/.cargo"
          - printf '[source.crates-io]\nreplace-with = "rsproxy-sparse"\n\n[source.rsproxy-sparse]\nregistry = "sparse+https://rsproxy.cn/index/"\n' > "$HOME/.cargo/config.toml"
          - ''
          - '# ===== 5. Node 20 直装 + 前端构建（dist 必须先于 cargo build：generate_context 会嵌入静态资源）====='
          - NODE_VERSION=20.19.4
          - curl -fSL --retry 5 -o /tmp/node.tar.xz "https://registry.npmmirror.com/-/binary/node/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          - tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          - node -v && npm -v
          - npm config set registry https://registry.npmmirror.com
          - npm install --legacy-peer-deps
          - npm run check:i18n
          - npm run build
          - ''
          - '# ===== 6. 交叉编译环境变量 ====='
          - '# 实测（2026-10-01）：1c2g 不可行——windows v0.61 crate 前端编译单进程就吃满 2GiB cgroup（采样 memory.current 顶到 2147483648 后被无声 SIGKILL），与并行度/LTO/链接器无关；本依赖树最低 2c4g'
          - export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
          - export CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc
          - export CXX_x86_64_pc_windows_gnu=x86_64-w64-mingw32-g++
          - export AR_x86_64_pc_windows_gnu=x86_64-w64-mingw32-ar
          - ''
          - '# ===== 7. release 交叉编译（完整桌面功能 + --server 模式，同一 exe）====='
          - '# --features custom-protocol：不经 tauri build 时必须开启，否则桌面模式内嵌资源不生效'
          - cd src-tauri
          - cargo build --release --target x86_64-pc-windows-gnu --features custom-protocol
          - cd ..
          - ''
          - '# ===== 8. 产物目录（Gitee Go 平台自动将整个目录打成 tgz，无需自行 zip）====='
          - mkdir -p webui-out/dist
          - cp -r dist/* webui-out/dist/
          - cp src-tauri/target/x86_64-pc-windows-gnu/release/zcode-switch.exe webui-out/
          - '# windows-gnu 目标下 webview2-com-sys 动态链接 WebView2Loader.dll，必须随包分发；--server 模式不创建窗口，仍不要求 WebView2 运行时'
          - LOADER=$(find "$HOME/.cargo/registry/src" -path '*webview2-com-sys*/x64/WebView2Loader.dll' 2>/dev/null | head -n 1)
          - '[ -n "$LOADER" ] || LOADER=$(find "$HOME/.cargo/registry/src" -name "WebView2Loader.dll" -path "*webview2-com-sys*" 2>/dev/null | head -n 1)'
          - echo "WebView2Loader.dll => $LOADER"
          - '[ -n "$LOADER" ] && cp "$LOADER" webui-out/'
          - cp release-web/README-WEB.md webui-out/
          - ls -lh webui-out/
        artifacts:
          - name: WEBUI_PACKAGE
            path:
              - ./webui-out
        caches:
          - ~/.cargo
          - /var/cache/apt/archives
          - /var/lib/apt/lists
        notify: []
        strategy:
          retry: '0'
          resource:
            cpu: '2'
            memory: '4'
